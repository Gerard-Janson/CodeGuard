[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codeguard"
version = "0.1.0"
description = "Unified local vulnerability scanner combining Semgrep, Trivy, and Gitleaks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "gerardjanson1998@gmail.com" }
]
keywords = ["security", "sast", "vulnerability", "semgrep", "trivy", "gitleaks"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
]

dependencies = [
    "semgrep>=1.70",
    "requests>=2.31",
    "zxcvbn>=4.4.28",
    "jinja2>=3.1",
    "weasyprint>=61.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
]

[project.scripts]
codeguard = "codeguard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["codeguard*"]